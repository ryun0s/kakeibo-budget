<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#faf6ef">
  <meta name="description" content="A private, offline household budget book for tracking income, spending and savings in Japanese yen.">
  <title>Kakeibo — Household Budget Book</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/store.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="masthead wrap">
      <a class="brand" href="#/" aria-label="Kakeibo overview">
        <svg class="seal" width="35" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <path fill="currentColor" d="m3 1 31 .6 1 31.7-32.8 1.1L1 3z"/>
          <g stroke="#fff9ed" stroke-width="1.45" stroke-linecap="round" stroke-linejoin="round">
            <path d="m7 9.5 6-1 5 1.5 5-1.6 6 1v15.8l-6-1-5 1.6-5-1.5-6 1zM18 10v15.5M10.2 13.2l3.2-.5 1.8.5m-5 3.7 3.2-.5 1.8.5m5.8-3.7 2.2-.6 2.9.5m-5.1 4 2.2-.6 2.9.5"/>
          </g>
        </svg>
        <span>Kakeibo</span>
      </a>
      <nav id="navigation" aria-label="Budget book"></nav>
      <span class="local-status" id="save-status"><i></i>Saved locally</span>
    </div>
  </header>
  <main class="wrap" id="main" tabindex="-1"></main>
  <div role="status" aria-live="polite" id="notice"></div>
  <dialog id="confirm-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-copy">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-copy"></p>
      <div class="dialog-actions">
        <button value="cancel" class="secondary" autofocus>Cancel</button>
        <button value="confirm" class="primary" id="confirm-action"></button>
      </div>
    </form>
  </dialog>
  <noscript>This budget book needs JavaScript to calculate your monthly totals and save entries on this device.</noscript>
</body>
</html>
